app:
  submit: Изпрати

reset_password_request:
  title: Нулирай паролата си
  instructions: Въведете своя имейл адрес и ще получите връзка за нулиране на паролата.
  submit: Изпрати линк за нулиране
  check_email_message: Ако вашият имейл съществува в нашата система, ще получите връзка за нулиране на паролата.
  too_many_requests: Твърде много заявки за нулиране на парола. Моля, опитайте отново по-късно.
  back_to_login: Обратно към входа

reset_password:
  title: Нулирай паролата си
  invalid_token: Невалиден или изтекъл линк за промяна на паролата.
  success: Успешна промяна на паролата. Вече можете да влезете в системата.
  success_with_login: Успешна промяна на паролата. Сега можете да %tagOpen%влезете оттук%tagClose%.
  email:
    subject: Заявка за нулиране на паролата ви
    body: |
      <p>Здравейте,</p>
      <p>Получихме заявка за смяна на паролата ви. Моля, кликнете на линка по-долу, за да я нулирате:</p>
      <p><a href="%resetUrl%">Нулирайте паролата си</a></p>
      <p>Ако не сте поискали смяна на парола, можете да игнорирате това съобщение.</p>
      <p>Поздрави,<br>Екипът на Identity Link</p>

form_reset_password_request:
  email:
    label: Имейл адрес

form_reset_password:
  new_password:
    label: Нова парола
  confirm_password:
    label: Потвърди паролата